name: Mantener activa la base (Supabase)

# Supabase pausa los proyectos del plan Free con muy poca actividad durante 7 días.
# Este workflow hace una consulta liviana cada 3 días (lee 1 categoría, no modifica nada)
# para que la base siga activa aunque nadie use la app. Si la consulta falla, el run queda
# en rojo y GitHub te avisa por mail.

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada 3 días, 12:17 UTC (09:17 en Argentina)
  workflow_dispatch:          # para correrlo a mano: Actions → Run workflow

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    # Las variables de Supabase están cargadas en el environment github-pages
    environment: github-pages
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY en el environment github-pages"
            exit 1
          fi
          URL="${SUPABASE_URL%/}/rest/v1/categorias?select=id&limit=1"
          for intento in 1 2 3; do
            codigo=$(curl -s -o respuesta.json -w '%{http_code}' --max-time 30 \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" "$URL" || echo 000)
            if [ "$codigo" = "200" ] && grep -q '^\[' respuesta.json; then
              echo "Base activa (HTTP $codigo): $(cat respuesta.json)"
              exit 0
            fi
            echo "Intento $intento: HTTP $codigo · $(head -c 300 respuesta.json 2>/dev/null)"
            sleep 20
          done
          echo "::error::La base no respondió. Si el proyecto está pausado, reactivalo desde el dashboard de Supabase."
          exit 1